# Surveillance automatisée des dépendances
version: 2

updates:
  # ─── Dépendances Dart / Flutter (pub) ────────────────────────────────────
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "maintenance"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

    ignore:
      - dependency-name: "build_runner"
      - dependency-name: "freezed"
      - dependency-name: "freezed_annotation"
      - dependency-name: "json_serializable"
      - dependency-name: "json_annotation"
      - dependency-name: "riverpod_generator"
      - dependency-name: "riverpod_annotation"
      - dependency-name: "flutter_riverpod"
      - dependency-name: "share_plus"

    groups:
      pub-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─── Actions GitHub utilisées par la CI ──────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"