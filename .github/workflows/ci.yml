name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  flutter_ci:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      # pubspec.lock étant versionné, cette étape installe exactement
      # les versions qu'il fige : les builds sont reproductibles.
      - name: Install dependencies
        run: flutter pub get

      # Relevé des dépendances en retard de version. N'échoue jamais :
      # la sortie sert de support à la revue mensuelle des dépendances.
      # L'écosystème pub ne fournit pas de commande d'audit de
      # vulnérabilités ; cette couverture est assurée par les alertes
      # Dependabot configurées sur le dépôt.
      - name: Check outdated dependencies
        run: flutter pub outdated || true

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/itam-release.jks

      - name: Create key.properties
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../itam-release.jks
          EOF

      # Exécuté sur tous les push : seul le build Gradle détecte les
      # ruptures côté Android (manifeste, conflits de dépendances natives)
      # que l'analyse statique et les tests ne voient pas.
      # Hors tag, l'APK produit est signé avec la clé de débogage et
      # n'est pas publié.
      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Upload signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: itam-app-release-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90