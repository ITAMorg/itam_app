name: itam_app
description: ITAM - IT Asset Management Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1

  # State management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Navigation
  go_router: ^14.6.2

  # Network
  dio: ^5.11.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Utilities
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  equatable: ^2.1.0
  intl: ^0.20.3
  dart_jsonwebtoken: ^2.14.0
  path_provider: ^2.1.6

  # Qr code
  mobile_scanner: ^6.0.0
  image_picker: ^1.2.3
  file_picker: ^8.1.2
  share_plus: ^10.0.0
  printing: ^5.15.0
  gal: ^2.3.3
  flutter_zxing: ^1.8.0
  pdf: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

  # Code generation
  build_runner: ^2.16.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/